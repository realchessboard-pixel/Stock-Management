name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stockflow:stockflow@localhost:5432/stockflow
      TEST_DATABASE_URL: postgresql://stockflow:stockflow@localhost:5432/stockflow_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=stockflow psql -h localhost -U stockflow -d stockflow -c "CREATE DATABASE stockflow_test"
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (emulated Android phone)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
